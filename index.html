<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Bandawe Girls Secondary School</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' data: gap: https://ssl.gstatic.com;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://www.gstatic.com https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com wss://*.firebaseio.com https://cdn.jsdelivr.net;
    ">
    
    <!-- SheetJS (XLSX) for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>

<body class="bg-gray-50 font-sans antialiased min-h-screen">

    <!-- LOGIN SCREEN OVERLAY (DYNAMICALLY TARGETED BY JS AUTH) -->
    <div id="login-screen" class="hidden fixed inset-0 z-50 bg-indigo-900/90 backdrop-blur-sm flex items-center justify-center p-4">
        <!-- Injected via script.js if user is unauthenticated -->
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app-layout" class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-indigo-800 text-white flex flex-col transition-all duration-300 relative min-h-screen flex-shrink-0 z-30">
            
            <!-- Collapse/Expand Button -->
            <button id="sidebar-collapse" 
                    onclick="typeof toggleSidebar === 'function' ? toggleSidebar() : null"
                    class="absolute -right-4 top-4 bg-indigo-600 hover:bg-indigo-500 text-white w-8 h-8 rounded-full flex items-center justify-center border-2 border-white shadow-xl hover:shadow-2xl transition-all duration-300 z-50"
                    title="Toggle Sidebar">
                <i id="collapse-icon" class="fas fa-chevron-left text-sm"></i>
            </button>
            
            <!-- Header / Brand -->
            <div class="p-6 border-b border-indigo-700">
                <div class="flex flex-col">
                    <h1 id="school-name" class="text-xl font-bold transition-all duration-300 whitespace-nowrap overflow-hidden">
                        Bandawe Girls<br>Secondary School
                    </h1>
                    <div class="border-b border-indigo-600 my-2"></div>
                    <p id="school-tagline" class="text-indigo-300 text-xs transition-all duration-300 whitespace-nowrap overflow-hidden">
                        Information Management System
                    </p>
                </div>
            </div>
            
            <!-- Dynamic Navigation Container -->
            <nav class="flex-1 p-4 overflow-y-auto sidebar-nav space-y-1" id="main-nav">
                <!-- Navigation buttons generated by script.js -->
            </nav>
            
            <!-- User Profile & Footer -->
            <div class="p-4 border-t border-indigo-700 space-y-2" id="user-profile">
                <!-- Quick Switch to Parent Results Portal -->
                 <button onclick="navigateTo('public-portal')" 
                   class="w-full flex items-center justify-center gap-2 py-2 px-3 bg-indigo-800/60 hover:bg-indigo-700 text-indigo-100 rounded-xl text-xs font-medium transition border border-indigo-700/50">
                    <i class="fas fa-external-link-alt text-indigo-300"></i>
                  <span>Switch to Results Portal</span>
                </button>

                <div class="flex items-center gap-3 px-4 py-3 bg-indigo-900/40 rounded-xl">
                    <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center flex-shrink-0 text-xs font-bold text-white">
                        <i class="fas fa-user"></i>
                    </div>
                    <div id="user-info" class="flex-1 transition-all duration-300 overflow-hidden min-w-0">
                        <p class="text-sm font-semibold text-white truncate" id="user-name">Guest</p>
                        <p class="text-xs text-indigo-300 truncate capitalize" id="user-role">Not logged in</p>
                    </div>
                    <button onclick="if(typeof handleLogout === 'function') handleLogout();" class="text-indigo-300 hover:text-red-400 transition text-sm p-1.5 rounded hover:bg-indigo-700/50" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT CONTAINER -->
        <div class="flex-1 flex flex-col overflow-hidden ml-0 min-w-0">
            
            <!-- TOP HEADER -->
            <header class="bg-white border-b border-gray-200 px-4 md:px-8 py-4 flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-3">
                    <button id="header-menu-btn" class="lg:hidden text-gray-600 hover:text-gray-800 p-2 rounded-lg hover:bg-gray-100 transition">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <i class="fas fa-school text-indigo-600 text-2xl hidden md:inline-block"></i>
                    <h2 id="page-title" class="text-2xl font-semibold text-gray-800">Dashboard</h2>
                </div>

                <div class="flex items-center gap-4">
                    <!-- User email & Logout button render here when logged in -->
                    <div id="user-header-info"></div>

                    <button id="add-new-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg flex items-center gap-2 transition btn-primary">
                        <i class="fas fa-plus"></i>
                        <span id="add-btn-text">Add New</span>
                    </button>
                </div>
            </header>

            <!-- VIEWPORT AREA (DUAL ID WRAPPER FOR FULL JS COMPATIBILITY) -->
            <main id="main-content" class="flex-1 p-6 md:p-8 overflow-auto bg-gray-50">
                <div id="content" class="h-full w-full">
                    <!-- Loading Spinner -->
                    <div id="loading-spinner" class="flex items-center justify-center h-full">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- GENERAL MODAL CONTAINER -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full mx-4 shadow-2xl overflow-hidden">
            <div id="modal-content" class="p-8">
                <!-- Dynamic modal content injected by script.js -->
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="toast-container fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- FIREBASE COMPAT SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- FIREBASE CONFIG & INITIALIZATION -->
    <script> 
        const firebaseConfig = {
            apiKey: "AIzaSyCyeneilHs9UnE2FJdccoh13GCaEnqdM0w",
            authDomain: "school-management-system-f6f7c.firebaseapp.com",
            projectId: "school-management-system-f6f7c",
            storageBucket: "school-management-system-f6f7c.firebasestorage.app",
            messagingSenderId: "287063134420",
            appId: "1:287063134420:web:ac7d4daf831564090cab41"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
    </script>
    
    <!-- APPLICATION SCRIPT -->
    <script src="script.js"></script>
</body>
</html>
