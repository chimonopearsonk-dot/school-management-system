<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Bandawe Girls Secondary School</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' data: gap: https://ssl.gstatic.com;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://www.gstatic.com https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com wss://*.firebaseio.com https://cdn.jsdelivr.net;
    ">
    
    <!-- SheetJS (XLSX) for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>

<body class="bg-gray-50 font-sans">
    <div class="flex h-screen">
        
        <!-- Sidebar -->
        <div id="sidebar" class="w-64 bg-indigo-800 text-white flex flex-col transition-all duration-300 relative">
            <!-- Collapse/Expand Button -->
            <button id="sidebar-collapse" 
                    onclick="toggleSidebar()"
                    class="absolute -right-4 top-4 bg-indigo-600 hover:bg-indigo-500 text-white w-8 h-8 rounded-full flex items-center justify-center border-2 border-white shadow-xl hover:shadow-2xl transition-all duration-300 z-50">
                <i id="collapse-icon" class="fas fa-chevron-left text-sm"></i>
            </button>
            
            <div class="p-6 border-b border-indigo-700">
                <div class="flex flex-col">
                    <h1 id="school-name" class="text-xl font-bold transition-all duration-300 whitespace-nowrap">
                        Bandawe Girls<br>Secondary School
                    </h1>
                    <div class="border-b border-indigo-600 my-2"></div>
                    <p id="school-tagline" class="text-indigo-300 text-sm transition-all duration-300 whitespace-nowrap">
                        Information Management System
                    </p>
                </div>
            </div>
            
            <nav class="flex-1 p-4 overflow-y-auto sidebar-nav" id="main-nav">
                <!-- Navigation generated by JavaScript -->
            </nav>
            
            <div class="p-4 border-t border-indigo-700 space-y-2" id="user-profile">
                <a href="results-portal.html" class="flex items-center gap-2 px-4 py-2 text-indigo-300 hover:text-white transition text-sm rounded-lg hover:bg-indigo-700">
                    <i class="fas fa-file-alt"></i>
                    <span>Results Portal</span>
                </a>
                <div class="flex items-center gap-3 px-4 py-3">
                    <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-user"></i>
                    </div>
                    <div id="user-info" class="flex-1 transition-all duration-300">
                        <p class="text-sm font-medium" id="user-name">Guest</p>
                        <p class="text-xs text-indigo-300" id="user-role">Not logged in</p>
                    </div>
                    <button onclick="handleLogout()" class="text-indigo-300 hover:text-white transition text-sm" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden ml-0">
            <!-- Header -->
            <header class="bg-white border-b border-gray-200 px-4 md:px-8 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button id="header-menu-btn" class="lg:hidden text-gray-600 hover:text-gray-800 p-2 rounded-lg hover:bg-gray-100 transition">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <i class="fas fa-school text-indigo-600 text-2xl hidden md:inline-block"></i>
                    <h2 id="page-title" class="text-2xl font-semibold text-gray-800">Dashboard</h2>
                </div>

                <div class="flex items-center gap-4">
                    <!-- User email & Logout button render here when logged in -->
                    <div id="user-header-info"></div>

                    <button id="add-new-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg flex items-center gap-2 transition btn-primary">
                        <i class="fas fa-plus"></i>
                        <span id="add-btn-text">Add New</span>
                    </button>
                </div>
            </header>

            <div id="content" class="flex-1 p-8 overflow-auto">
                <!-- Loading Spinner -->
                <div id="loading-spinner" class="flex items-center justify-center h-full">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full mx-4">
            <div id="modal-content" class="p-8">
                <!-- Modal content injected by JS -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <!-- Firebase Firestore (Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Firebase Authentication -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script> 
        // Your web app's Firebase configuration
        const firebaseConfig = {

            authDomain: "school-management-system-f6f7c.firebaseapp.com",
            projectId: "school-management-system-f6f7c",
            storageBucket: "school-management-system-f6f7c.firebasestorage.app",
            messagingSenderId: "287063134420",
            appId: "1:287063134420:web:ac7d4daf831564090cab41"
        };
        // Initialize Firebase, Firestore, & Auth
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
    </script>
    
    <script src="script.js"></script>
</body>
</html>
